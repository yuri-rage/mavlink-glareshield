# The desktop app (desktop/): Linux AppImage and a Windows installer (NSIS), both able to update themselves from
# GitHub Releases. macOS is not built (it needs a paid Apple Developer ID to run without warnings).
appId: com.yurirage.glareshield
productName: Glareshield
copyright: Copyright © Yuri Rage
directories:
  output: release
  buildResources: build
# The page (dist/), the bundled main process and preload (desktop/dist/, esbuild), and the production dependencies:
# only the native serial binding (@serialport/bindings-cpp). The web app's packages are dev dependencies: Vite has
# already bundled them into dist/.
files:
  - dist/**
  - desktop/dist/**
  - desktop/package.json
  - package.json
asar: true
# Native modules use their prebuilt, Node-API binaries (portable across Electron versions and distros); building
# them from source here would tie the Linux one to this machine's libraries, and needs a compiler on Windows.
npmRebuild: false
publish:
  provider: github
  owner: yuri-rage
  repo: mavlink-glareshield
  releaseType: release
linux:
  target: AppImage
  category: Science
  # The window's app ID, the launcher entry and the icon are all "glareshield" (matching desktopName).
  executableName: glareshield
  syncDesktopName: true
  icon: public/logo-512.png
  artifactName: Glareshield-${version}-${arch}.AppImage
win:
  target:
    - target: nsis
      arch: [x64]
  # Its own .ico: bitmap entries up to 128 px, PNG only at 256 (an icon converted from the PNG had every size
  # PNG-compressed, and the Start menu showed a generic icon). Rebuilt from public/logo-512.png with icotool.
  icon: build/icon.ico
  artifactName: Glareshield-Setup-${version}.${ext}
nsis:
  # Per user, no admin rights needed; the person may choose where it goes.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Glareshield
