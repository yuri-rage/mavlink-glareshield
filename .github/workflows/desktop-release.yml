# The desktop app (desktop/, electron-builder.yml): a Linux AppImage and a Windows installer (NSIS).
#
# - Push a version tag (v0.2.0): both are built and published to that tag's GitHub Release, where the installed apps
#   look for updates. The tag sets the version (package.json's is only the default).
# - Run it by hand (Actions → Desktop release → Run workflow), or a pull request that touches the desktop app: both
#   are built and kept as workflow artifacts, nothing is published. For trying a build before tagging.
#
# macOS isn't built: it needs a paid Apple Developer ID.
#
# Windows signing (Azure Artifact Signing, formerly Trusted Signing) is on once it's configured, off (unsigned) until
# then: repository secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app registration with the
# "Artifact Signing Certificate Profile Signer" role) and repository variables AZURE_SIGN_ENDPOINT (e.g.
# https://eus.codesigning.azure.net/), AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE and AZURE_SIGN_PUBLISHER (the
# certificate's subject name, exactly). See docs/desktop-app.md.

name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/desktop/**'
      - 'electron-builder.yml'
      - '.github/workflows/desktop-release.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: --linux
            artifact: release/*.AppImage
          - os: windows-latest
            platform: windows
            target: --win
            artifact: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Windows signing (when configured)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: |
          if [ "$HAS_SECRET" = "true" ] && [ -n "$ENDPOINT" ] && [ -n "$ACCOUNT" ] && [ -n "$PROFILE" ] && [ -n "$PUBLISHER" ]; then
            {
              echo "SIGN_ARGS=-c.win.azureSignOptions.endpoint=$ENDPOINT -c.win.azureSignOptions.codeSigningAccountName=$ACCOUNT -c.win.azureSignOptions.certificateProfileName=$PROFILE -c.win.azureSignOptions.publisherName=\"$PUBLISHER\""
            } >> "$GITHUB_ENV"
            echo "Signing with Azure Artifact Signing ($ACCOUNT / $PROFILE)"
          else
            echo "::notice::Windows signing isn't configured: this build is unsigned."
          fi

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build and publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run build && npm run desktop:compile && eval npx electron-builder ${{ matrix.target }} $SIGN_ARGS --publish always

      - name: Build only (manual run, pull request)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run build && npm run desktop:compile && eval npx electron-builder ${{ matrix.target }} $SIGN_ARGS --publish never

      - name: Keep the build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          # By platform, not runner: the AppImage runs on any x86_64 Linux, not only Ubuntu.
          name: glareshield-${{ matrix.platform }}
          retention-days: 14
          path: ${{ matrix.artifact }}
          if-no-files-found: error
