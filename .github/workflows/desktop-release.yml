# The desktop app (desktop/, electron-builder.yml): a Linux AppImage and a Windows installer (NSIS).
#
# - Push a version tag (v0.2.0): both are built and published to that tag's GitHub Release, where the installed apps
#   look for updates. The tag sets the version (package.json's is only the default). Then the notes job writes the
#   release notes (scripts/release-notes.sh): the pull requests merged since the previous release, and the SmartScreen
#   hint while Windows builds are unsigned.
# - Run it by hand (Actions → Desktop release → Run workflow), or a pull request that touches the desktop app: both
#   are built and kept as workflow artifacts, nothing is published. For trying a build before tagging.
#
# macOS isn't built: it needs a paid Apple Developer ID.
#
# Windows signing (Azure Artifact Signing, formerly Trusted Signing) is on once it's configured, off (unsigned) until
# then: repository secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app registration with the
# "Artifact Signing Certificate Profile Signer" role) and repository variables AZURE_SIGN_ENDPOINT (e.g.
# https://eus.codesigning.azure.net/), AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE and AZURE_SIGN_PUBLISHER (the
# certificate's subject name, exactly). See docs/desktop-app.md.

name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/desktop/**'
      - 'electron-builder.yml'
      - '.github/workflows/desktop-release.yml'
      - 'package.json'
      - 'package-lock.json'

# Read-only by default; only the tag's release job may write (publish to the release).
permissions:
  contents: read

jobs:
  # A pull request or manual run: build and keep the artifacts (read-only token).
  build:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    name: build (${{ matrix.platform }})
    strategy: &matrix
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: --linux
            artifact: release/*.AppImage
          - os: windows-latest
            platform: windows
            target: --win
            artifact: release/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps: &steps
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build (and publish, for a tag)
        shell: bash
        env:
          GH_TOKEN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.GITHUB_TOKEN || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Arguments as an array: values with spaces or quotes (the publisher name) pass through intact.
          args=(${{ matrix.target }})
          if [ "${{ matrix.platform }}" = windows ]; then
            if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$SIGN_ENDPOINT" ] && [ -n "$SIGN_ACCOUNT" ] && [ -n "$SIGN_PROFILE" ] && [ -n "$SIGN_PUBLISHER" ]; then
              args+=("-c.win.azureSignOptions.endpoint=$SIGN_ENDPOINT"
                     "-c.win.azureSignOptions.codeSigningAccountName=$SIGN_ACCOUNT"
                     "-c.win.azureSignOptions.certificateProfileName=$SIGN_PROFILE"
                     "-c.win.azureSignOptions.publisherName=$SIGN_PUBLISHER")
              echo "Signing with Azure Artifact Signing ($SIGN_ACCOUNT / $SIGN_PROFILE)"
            else
              echo "::notice::Windows signing isn't configured: this build is unsigned."
            fi
          fi
          if [ "$IS_TAG" = true ]; then args+=(--publish always); else args+=(--publish never); fi
          npm run build
          npm run desktop:compile
          npx electron-builder "${args[@]}"

      - name: Keep the build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v6
        with:
          # By platform, not runner: the AppImage runs on any x86_64 Linux, not only Ubuntu.
          name: glareshield-${{ matrix.platform }}
          retention-days: 14
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # A version tag: build and publish to its release (the only job that may write).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: release (${{ matrix.platform }})
    strategy: *matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps: *steps

  # After both builds have published: the release notes (the PRs since the previous release; the SmartScreen hint
  # while unsigned). One job, so the two builds never race to edit the release body.
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGN_ENDPOINT != '' }}
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" --apply
