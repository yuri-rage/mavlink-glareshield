# The desktop app (desktop/, electron-builder.yml): a Linux AppImage and a Windows installer (NSIS).
#
# - Push a version tag (v0.2.0): both are built and published to that tag's GitHub Release, where the installed apps
#   look for updates. The tag sets the version (package.json's is only the default).
# - Run it by hand (Actions → Desktop release → Run workflow): both are built and kept as workflow artifacts, nothing
#   is published. For trying a build before tagging.
#
# macOS isn't built: it needs a paid Apple Developer ID. Windows builds are unsigned for now (SmartScreen warns on
# first run).

name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            artifact: release/*.AppImage
          - os: windows-latest
            target: --win
            artifact: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build and publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npm run desktop:compile && npx electron-builder ${{ matrix.target }} --publish always

      - name: Build only (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run desktop:dist -- ${{ matrix.target }}

      - name: Keep the build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: glareshield-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
