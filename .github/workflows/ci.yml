name: Test & Build

# Deployment is handled by Cloudflare Workers Builds (the "glareshield" Worker's Git integration,
# configured by wrangler.jsonc). This workflow only gates changes on the test suite and build.

on:
  push:
    branches:
      - master
  # Every pull request, including ones stacked on another PR's branch.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_and_build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (bridge tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bridge/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          # pymavlink builds reference packets for the bridge UDP test (same version as the golden vectors).
          pip install -r bridge/requirements.txt pymavlink==2.4.50

      - name: Run unit & regression tests
        run: |
          npm test
          npm run test:regressions
          npm run test:ftp-sim

      - name: Run bridge tests
        run: |
          npm run test:bridge-security
          npm run test:bridge-udp

      - name: Build production bundle
        run: npm run build
